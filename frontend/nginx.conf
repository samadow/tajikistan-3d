types {
    model/gltf-binary glb;
    image/ktx2 ktx2;
    application/wasm wasm;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary application/wasm;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Django: API, admin and its static files.
    location ~ ^/(api|admin|static|health)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded media (GLB models, photos) straight from the shared volume.
    location /media/ {
        alias /media/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
    }

    # Hashed build assets never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /terrain/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location /decoders/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA routes (/place/…, /story) fall back to index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
