# Production-like stack: PostgreSQL + Django (gunicorn) + nginx serving the built SPA.
#   cp .env.example .env   # then edit the secrets
#   docker compose up --build
#   open http://localhost:8080  (admin: http://localhost:8080/admin/)
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tajikistan3d}
      POSTGRES_USER: ${POSTGRES_USER:-tajikistan3d}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      DJANGO_MEDIA_ROOT: /app/media
      TRUSTED_PROXIES: "1"   # nginx
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - media:/media:ro
    depends_on:
      - backend

volumes:
  pgdata:
  media:
